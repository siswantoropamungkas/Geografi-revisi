<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco-Adventure: Lingkungan Hidup</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #FF0055 0%, #7A00FF 35%, #00E5FF 70%, #FFD600 100%);
      --card-bg: #FFFFFF;
      --neon-yellow: #FFEA00;
      --neon-green: #00FF66;
      --neon-cyan: #00F0FF;
      --neon-pink: #FF007F;
      --neon-orange: #FF5500;
      --neon-purple: #9000FF;
      --text-dark: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Poppins', sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      background-size: 300% 300%;
      animation: gradientBG 8s ease infinite;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--neon-yellow);
      text-shadow: 4px 4px 0px #000, -3px -3px 0px var(--neon-pink), 6px 6px 0px var(--neon-purple);
    }

    .subtitle {
      background: #000;
      color: var(--neon-green);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 700;
      display: inline-block;
      margin-top: 8px;
      border: 3px solid #FFF;
      box-shadow: 4px 4px 0px #000;
    }

    /* Main Container Layout */
    .game-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    @media (min-width: 850px) {
      .game-container {
        display: grid;
        grid-template-columns: 1fr 320px;
      }
    }

    /* Board Area */
    .board-card {
      background: var(--card-bg);
      border: 5px solid #000;
      border-radius: 28px;
      padding: 20px;
      box-shadow: 8px 8px 0px #000;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .tile {
      background: #FFF;
      border: 4px solid #000;
      border-radius: 20px;
      min-height: 110px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 5px 5px 0px #000;
    }

    .tile.active {
      transform: translate(-3px, -3px);
      box-shadow: 8px 8px 0px #000;
    }

    .tile:nth-child(5n+1) { background: #FFD6E0; border-color: #000; }
    .tile:nth-child(5n+2) { background: #C7F9CC; border-color: #000; }
    .tile:nth-child(5n+3) { background: #FFFAA0; border-color: #000; }
    .tile:nth-child(5n+4) { background: #D8BBFF; border-color: #000; }
    .tile:nth-child(5n+5) { background: #E7C6FF; border-color: #000; }

    .tile-num {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 0.85rem;
      font-weight: 900;
      background: #000;
      color: #FFF;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .tile-icon {
      font-size: 2.3rem;
      margin-top: 15px;
      filter: drop-shadow(3px 3px 0px #000);
    }

    .tile-title {
      font-size: 0.78rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.1;
      margin-top: 4px;
      color: #000;
      text-transform: uppercase;
    }

    .tile-start { 
      background: var(--neon-green) !important; 
      box-shadow: 5px 5px 0px #000;
    }

    .tile-finish { 
      background: var(--neon-pink) !important; 
      color: #FFF;
      box-shadow: 5px 5px 0px #000;
    }
    .tile-finish .tile-title { color: #FFF; }

    /* Player Pawn */
    .pawn {
      width: 36px;
      height: 36px;
      background: var(--neon-yellow);
      border: 4px solid #000;
      border-radius: 50%;
      position: absolute;
      top: 4px;
      right: 4px;
      box-shadow: 3px 3px 0px #000;
      z-index: 5;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      animation: pulsePawn 0.8s infinite alternate;
    }

    @keyframes pulsePawn {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    /* Controls & Sidebar Panel */
    .panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .controls-card, .log-card {
      background: #FFF;
      border: 5px solid #000;
      border-radius: 28px;
      padding: 20px;
      box-shadow: 8px 8px 0px #000;
      text-align: center;
    }

    .dice-container {
      margin: 15px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dice {
      width: 85px;
      height: 85px;
      background: var(--neon-cyan);
      border: 5px solid #000;
      border-radius: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      font-weight: 900;
      color: #000;
      box-shadow: 6px 6px 0px #000;
    }

    .dice.rolling {
      animation: roll 0.3s infinite linear;
    }

    @keyframes roll {
      0% { transform: rotate(0deg) scale(0.9); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(0.9); }
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: 4px solid #000;
      border-radius: 18px;
      font-weight: 900;
      font-size: 1.15rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .btn-roll {
      background: var(--neon-pink);
      color: #FFF;
      box-shadow: 5px 5px 0px #000;
    }

    .btn-roll:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px #000;
    }

    .btn-roll:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }

    .btn-roll:disabled {
      background: #DDD;
      box-shadow: 4px 4px 0px #000;
      cursor: not-allowed;
    }

    .log-card {
      text-align: left;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .log-card h3 {
      color: #000;
      font-size: 1.15rem;
      font-weight: 900;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .log-list {
      list-style: none;
      font-size: 0.88rem;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-item {
      background: var(--neon-yellow);
      padding: 10px 12px;
      border-radius: 14px;
      border: 3px solid #000;
      box-shadow: 3px 3px 0px #000;
      font-weight: 800;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #FFF;
      border: 6px solid #000;
      border-radius: 30px;
      max-width: 550px;
      width: 100%;
      padding: 28px;
      box-shadow: 12px 12px 0px #000;
      transform: scale(0.8);
      transition: transform 0.25s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 15px;
      border-bottom: 4px solid #000;
      padding-bottom: 12px;
    }

    .modal-header .icon {
      font-size: 2.8rem;
      background: var(--neon-cyan);
      padding: 8px;
      border-radius: 18px;
      border: 3px solid #000;
    }

    .modal-header h2 {
      font-size: 1.4rem;
      font-weight: 900;
      color: #000;
      text-transform: uppercase;
    }

    .modal-body {
      font-size: 0.98rem;
      line-height: 1.6;
      color: #000;
      margin-bottom: 20px;
    }

    .modal-body strong {
      color: var(--neon-pink);
    }

    .modal-body ul {
      margin-left: 20px;
      margin-top: 8px;
    }

    .modal-body li {
      margin-bottom: 5px;
    }

    /* Quiz Timer Styling */
    .quiz-timer-bar {
      width: 100%;
      height: 12px;
      background: #ddd;
      border: 3px solid #000;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .quiz-timer-fill {
      height: 100%;
      background: var(--neon-pink);
      width: 100%;
      transition: width 1s linear;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }

    .quiz-opt-btn {
      background: #FFF;
      border: 3px solid #000;
      color: #000;
      padding: 14px;
      border-radius: 16px;
      text-align: left;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 4px 4px 0px #000;
    }

    .quiz-opt-btn:hover {
      background: var(--neon-yellow);
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000;
    }

    .btn-action {
      background: var(--neon-green);
      color: #000;
      box-shadow: 5px 5px 0px #000;
    }

    .btn-action:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px #000;
    }
  </style>
</head>
<body>

  <header>
    <h1>ECO-BOARD 🌟</h1>
    <div class="subtitle">Petualangan Lingkungan Hidup & Kependudukan</div>
  </header>

  <div class="game-container">
    <!-- Board Area -->
    <div class="board-card">
      <div class="board-grid" id="boardGrid"></div>
    </div>

    <!-- Controls Sidebar -->
    <div class="panel">
      <div class="controls-card">
        <div style="font-size: 0.9rem; font-weight:900; color: #000;">KOCOK DADU</div>
        <div class="dice-container">
          <div class="dice" id="dice">🎲</div>
        </div>
        <button class="btn btn-roll" id="rollBtn">Lempar Dadu</button>
      </div>

      <div class="log-card">
        <h3>📖 Buku Jurnal Materi</h3>
        <ul class="log-list" id="logList">
          <li class="log-item">Lemparkan dadu untuk mulai menjelajah!</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Material Pop-up Modal -->
  <div class="modal-overlay" id="materialModal">
    <div class="modal">
      <div class="modal-header">
        <span class="icon" id="mIcon">🌿</span>
        <h2 id="mTitle">Judul Materi</h2>
      </div>
      <div class="modal-body" id="mBody">Isi materi...</div>
      <button class="btn btn-action" id="closeMaterialBtn">Siap, Pahami Materi!</button>
    </div>
  </div>

  <!-- Final Quiz Modal -->
  <div class="modal-overlay" id="quizModal">
    <div class="modal">
      <div class="modal-header">
        <span class="icon">🏆</span>
        <h2>KUIS AKHIR (15 SOAL)</h2>
      </div>
      <div class="modal-body">
        <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 0.9rem; margin-bottom: 5px;">
          <span id="quizTimerText">Waktu: 30s</span>
          <span id="quizProgressText">Soal 1/15</span>
        </div>
        <div class="quiz-timer-bar">
          <div class="quiz-timer-fill" id="timerFill"></div>
        </div>
        <p id="quizQuestion" style="font-weight: 800; font-size: 1.05rem; margin-bottom: 12px;"></p>
        <div class="quiz-options" id="quizOptions"></div>
      </div>
    </div>
  </div>

  <script>
    const boardTiles = [
      { id: 0, title: "START", icon: "🚀", type: "start" },
      { id: 1, title: "Konsep Dasar", icon: "📘", type: "material", content: "<strong>Pengertian Lingkungan Hidup (UU No. 32/2009):</strong> Kesatuan ruang dengan segala benda, daya, keadaan, dan makhluk hidup termasuk manusia dan perilakunya.<br><br><strong>Ekologi:</strong> Ilmu hubungan timbal balik makhluk hidup dengan lingkungannya.<br><strong>Etika Lingkungan:</strong> Nilai moral agar perilaku manusia tetap menjaga kelentingan alam." },
      { id: 2, title: "Biotik & Abiotik", icon: "🌱", type: "material", content: "<strong>Lingkungan Biotik & Abiotik:</strong><ul><li><strong>Biotik:</strong> Unsur hayati (produsen/tumbuhan, konsumen/manusia & hewan, pengurai/bakteri & jamur).</li><li><strong>Abiotik:</strong> Unsur fisik/benda mati (air, tanah, udara, cahaya, suhu, iklim).</li></ul>" },
      { id: 3, title: "Sosial & Buatan", icon: "🏙️", type: "material", content: "<strong>Lingkungan Sosial, Budaya & Buatan:</strong><ul><li><strong>Sosial Budaya:</strong> Interaksi antarmanusia, norma, adat, serta cipta karya seni & bangunan.</li><li><strong>Buatan:</strong> Lingkungan hasil rekayasa teknologi manusia seperti jalan, sekolah, dan kawasan industri.</li></ul>" },
      { id: 4, title: "Manfaat Alam", icon: "🌍", type: "material", content: "<strong>Manfaat Utama Lingkungan Hidup:</strong><ul><li>Tempat tinggal & sarana interaksi sosial.</li><li>Penghasil pangan (makanan & air) serta penyedia SDA.</li><li>Menyediakan mikroorganisme penyubur tanah.</li><li>Sumber oksigen pernapasan serta tempat berpijak/mendirikan bangunan.</li></ul>" },
      { id: 5, title: "Daya Dukung", icon: "📊", type: "material", content: "<strong>Daya Dukung Lingkungan (Carrying Capacity):</strong> Ukuran kemampuan lingkungan mendukung populasi makhluk hidup.<br><br>Di Indonesia, kualitas lingkungan diukur menggunakan <strong>Indeks Kualitas Lingkungan Hidup (IKLH)</strong> yang dipengaruhi faktor alam dan faktor sosial budaya (IPTEK & tradisi)." },
      { id: 6, title: "Global Warming", icon: "🔥", type: "material", content: "<strong>Global Warming & Penipisan Ozon:</strong><br>Pemanasan global terjadi akibat efek gas rumah kaca yang menaikkan suhu bumi dan mencairkan es kutub.<br><br>Penipisan ozon disebabkan oleh polusi gas <strong>CFC</strong> yang merusak lapisan pelindung radiasi UV." },
      { id: 7, title: "Polusi Udara & Air", icon: "🏭", type: "material", content: "<strong>Pencemaran Udara & Air:</strong><ul><li><strong>Udara:</strong> Dari pembakaran bahan bakar fosil kendaraan/industri & kebakaran hutan (memicu hujan asam).</li><li><strong>Air:</strong> Kontaminasi limbah industri, bahan kimia, logam berat, pestisida, dan deterjen.</li></ul>" },
      { id: 8, title: "Polusi Tanah & Laut", icon: "🌊", type: "material", content: "<strong>Pencemaran Tanah & Laut:</strong><ul><li><strong>Tanah:</strong> Pestisida berlebih, pupuk anorganik, logam berat, & limbah domestik.</li><li><strong>Laut:</strong> Pengasaman laut akibat kelebihan CO_2 serta sampah pesisir sembarangan.</li></ul>" },
      { id: 9, title: "Lestari Udara & Air", icon: "🌳", type: "material", content: "<strong>Upaya Pelestarian Udara & Air:</strong><ul><li><strong>Udara:</strong> Penanaman pohon, pengurangan emisi gas buang, menghindari bahan kimia perusak ozon.</li><li><strong>Air:</strong> Pengelolaan pembuangan limbah industri yang tepat & meminimalkan polusi plastik.</li></ul>" },
      { id: 10, title: "Lestari Laut & Pantai", icon: "🐠", type: "material", content: "<strong>Pelestarian Laut & Pantai:</strong><br>Dilakukan dengan melestarikan hutan bakau (mangrove) dan terumbu karang, serta menghindari penggunaan bahan peledak atau pukat harimau saat menangkap ikan di laut." },
      { id: 11, title: "Pelestarian Tanah", icon: "⛰️", type: "material", content: "<strong>Pelestarian Tanah:</strong><br>Dilakukan melalui <strong>reboisasi</strong> pada hutan yang gundul serta pembuatan <strong>terasering</strong> (sengkedan) pada lahan miring untuk menghambat laju erosi air hujan." },
      { id: 12, title: "FINISH / KUIS", icon: "🏆", type: "finish" }
    ];

    const quizQuestions = [
      {
        q: "Apa landasan hukum utama di Indonesia yang mendefinisikan tentang Lingkungan Hidup?",
        options: ["UU No. 32 Tahun 2009", "UU No. 5 Tahun 1990", "UU No. 41 Tahun 1999", "UU No. 22 Tahun 2009"],
        answer: 0
      },
      {
        q: "Ilmu yang secara khusus mempelajari hubungan timbal balik antara makhluk hidup dan lingkungannya disebut...",
        options: ["Demografi", "Ekologi", "Topografi", "Meteorologi"],
        answer: 1
      },
      {
        q: "Manakah di bawah ini yang merupakan contoh komponen lingkungan biotik (unsur hayati)?",

        answer: 2

      {

      {

        answer: 0
      },
      {
        q: "Pengukuran kualitas lingkungan hidup di Indonesia secara kuantitatif umumnya menggunakan indikator...",
        options: ["IKLH (Indeks Kualitas Lingkungan Hidup)", "AMDAL", "CFC Index", "Indeks Suhu Global"],
        answer: 0
      },
      {
        q: "Pemanasan global (Global Warming) utamanya disebabkan oleh meningkatnya efek...",
        options: ["Gas rumah kaca", "Radiasi sinar ultraviolet murni", "Tekanan udara rendah", "Arus pasang surut laut"],
        answer: 0
      },
      {
        q: "Polusi gas apa yang paling bertanggung jawab atas penipisan lapisan ozon di atmosfer bumi?",
        options: ["Klorofluorokarbon (CFC)", "Karbon Monoksida (CO)", "Oksigen (O2)", "Nitrogen Murni"],
        answer: 0
      },
      {
        q: "Pembakaran bahan bakar fosil secara berlebihan dari kendaraan bermotor dan industri dapat memicu terjadinya...",
        options: ["Hujan asam", "Gempa vulkanik", "Tsunami", "Badai salju tropis"],
        answer: 0
      },
      {
        q: "Kontaminasi air akibat kelebihan pupuk anorganik, pestisida, dan deterjen dapat menyebabkan peristiwa...",
        options: ["Eutrofikasi / pencemaran air", "Penyuburan terumbu karang", "Peningkatan oksigen terlarut", "Pencairan es di kutub"],
        answer: 0
      },
      {
        q: "Pengasaman laut (Ocean Acidification) terjadi akibat kelebihan produksi gas apa di atmosfer?",
        options: ["Karbon Dioksida (CO_2)", "Hidrogen", "Helium", "Metana cair"],
        answer: 0
      },
      {
        q: "Upaya pelestarian wilayah pesisir dan pantai dapat dilakukan secara efektif dengan melestarikan...",
        options: ["Hutan bakau (mangrove) dan terumbu karang", "Gedung bertingkat di pinggir pantai", "Kawasan industri pasir besi", "Tambak garam modern"],
        answer: 0
      },
      {
        q: "Cara paling efektif untuk mencegah terjadinya erosi tanah di daerah pegunungan atau lahan miring adalah...",
        options: ["Membuat terasering (sengkedan) dan reboisasi", "Melakukan pembakaran rumput liar", "Menyiram tanah dengan bahan kimia", "Membangun jalan aspal berlapis"],
        answer: 1
      },
      {
        q: "Nilai-nilai keseimbangan dan prinsip moral agar perilaku manusia dalam mengelola lingkungan tetap terjaga disebut...",
        options: ["Etika lingkungan", "Etika bisnis", "Norma sosial modern", "Teknologi tepat guna"],
        answer: 0
      },
      {
        q: "Mikroorganisme di dalam tanah memiliki peran penting bagi lingkungan yaitu...",
        options: ["Menguraikan sisa makhluk hidup agar tanah menjadi subur", "Menghasilkan gas CFC penyebab ozon berlubang", "Menyerap seluruh cadangan air tanah", "Memicu terjadinya erosi"],
        answer: 0
      }
    ];

    let currentPosition = 0;
    let isRolling = false;
    let currentQuizIndex = 0;
    let quizScore = 0;
    let timerInterval = null;
    let timeLeft = 30;

    const boardGrid = document.getElementById('boardGrid');
    const rollBtn = document.getElementById('rollBtn');
    const diceEl = document.getElementById('dice');
    const logList = document.getElementById('logList');
    
    const materialModal = document.getElementById('materialModal');
    const mIcon = document.getElementById('mIcon');
    const mTitle = document.getElementById('mTitle');
    const mBody = document.getElementById('mBody');
    const closeMaterialBtn = document.getElementById('closeMaterialBtn');

    const quizModal = document.getElementById('quizModal');
    const quizQuestion = document.getElementById('quizQuestion');
    const quizOptions = document.getElementById('quizOptions');
    const quizTimerText = document.getElementById('quizTimerText');
    const quizProgressText = document.getElementById('quizProgressText');
    const timerFill = document.getElementById('timerFill');

    function initBoard() {
      boardGrid.innerHTML = '';
      boardTiles.forEach((tile) => {
        const tileDiv = document.createElement('div');
        tileDiv.className = `tile ${tile.type === 'start' ? 'tile-start' : ''} ${tile.type === 'finish' ? 'tile-finish' : ''}`;
        tileDiv.id = `tile-${tile.id}`;
        
        tileDiv.innerHTML = `
          <span class="tile-num">${tile.id}</span>
          <span class="tile-icon">${tile.icon}</span>
          <span class="tile-title">${tile.title}</span>
        `;
        boardGrid.appendChild(tileDiv);
      });
      renderPawn();
    }

    function renderPawn() {
      document.querySelectorAll('.pawn').forEach(el => el.remove());
      document.querySelectorAll('.tile').forEach(el => el.classList.remove('active'));

      const targetTile = document.getElementById(`tile-${currentPosition}`);
      targetTile.classList.add('active');

      const pawn = document.createElement('div');
      pawn.className = 'pawn';
      targetTile.appendChild(pawn);
    }

    rollBtn.addEventListener('click', () => {
      if (isRolling) return;
      isRolling = true;
      rollBtn.disabled = true;

      diceEl.classList.add('rolling');

      setTimeout(() => {
        const diceValue = Math.floor(Math.random() * 3) + 1;
        diceEl.classList.remove('rolling');
        diceEl.textContent = diceValue;

        movePlayer(diceValue);
        isRolling = false;
      }, 800);
    });

    function movePlayer(steps) {
      let targetPos = currentPosition + steps;
      if (targetPos >= boardTiles.length - 1) {
        targetPos = boardTiles.length - 1;
      }

      currentPosition = targetPos;
      renderPawn();

      setTimeout(() => {
        handleTileEvent(boardTiles[currentPosition]);
      }, 500);
    }

    function handleTileEvent(tile) {
      if (tile.type === 'material') {
        mIcon.textContent = tile.icon;
        mTitle.textContent = tile.title;
        mBody.innerHTML = tile.content;
        materialModal.classList.add('active');
        addLog(tile.title);
      } else if (tile.type === 'finish') {
        startQuiz();
      } else {
        rollBtn.disabled = false;
      }
    }

    closeMaterialBtn.addEventListener('click', () => {
      materialModal.classList.remove('active');
      rollBtn.disabled = false;
    });

    function addLog(title) {
      const exists = Array.from(logList.children).some(li => li.textContent.includes(title));
      if (!exists) {
        const li = document.createElement('li');
        li.className = 'log-item';
        li.textContent = `⭐ Pelajari: ${title}`;
        logList.appendChild(li);
      }
    }

    function startQuiz() {
      currentQuizIndex = 0;
      quizScore = 0;
      quizModal.classList.add('active');
      showQuizQuestion();
    }

    function showQuizQuestion() {
      clearInterval(timerInterval);
      timeLeft = 30;
      updateTimerDisplay();

      const q = quizQuestions[currentQuizIndex];
      quizQuestion.textContent = q.q;
      quizProgressText.textContent = `Soal ${currentQuizIndex + 1}/${quizQuestions.length}`;
      quizOptions.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt-btn';
        btn.textContent = opt;
        btn.addEventListener('click', () => {
          clearInterval(timerInterval);
          handleAnswer(idx);
        });
        quizOptions.appendChild(btn);
      });

      // Start Timer Countdown
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          // Waktu habis dianggap salah, lanjut ke soal berikutnya
          handleAnswer(-1);
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      quizTimerText.textContent = `Waktu: ${timeLeft}s`;
      const percentage = (timeLeft / 30) * 100;
      timerFill.style.width = `${percentage}%`;
    }

    function handleAnswer(selectedIndex) {
      if (selectedIndex === quizQuestions[currentQuizIndex].answer) {
        quizScore++;
      }

      currentQuizIndex++;
      if (currentQuizIndex < quizQuestions.length) {
        showQuizQuestion();
      } else {
        showQuizResult();
      }
    }

    function showQuizResult() {
      clearInterval(timerInterval);
      quizTimerText.textContent = "Waktu Selesai!";
      timerFill.style.width = "0%";
      quizProgressText.textContent = "Hasil Akhir";
      quizQuestion.innerHTML = `🎉 Selamat! Kamu menyelesaikan seluruh kuis.<br><br>Skor Akhir Kamu: <strong>${quizScore} / ${quizQuestions.length}</strong>`;
      quizOptions.innerHTML = `
        <button class="btn btn-action" onclick="location.reload()">Main Lagi dari Awal</button>
      `;
    }

    initBoard();
  </script>
</body>
</html>
